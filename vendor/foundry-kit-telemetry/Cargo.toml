[package]
name = "foundry-kit-telemetry"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Privacy-preserving kit telemetry — on-device aggregation, salted-hash identifiers, differential privacy, and the versioned rollup envelope. Vendored into anvil so the engine builds with no dependency on a private repository."
publish = false

[lib]
name = "foundry_kit_telemetry"
path = "src/lib.rs"

[dependencies]
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
