message BacklogQueueRequest {
  string hearth_path = 1;
  oneof scope {
    string business_node_id = 2;
    BacklogPresence cross_organ = 3;
  }
}
message BacklogQueueItem {
  string backlog_item_id = 1;
  string business_node_id = 2;
  string state = 3;
  uint32 position = 4;
  string title = 5;
  string explanation = 6;
  bool route_to_intake = 7;
}
message BacklogUnrankedQueueItem {
  string backlog_item_id = 1;
  string business_node_id = 2;
  string state = 3;
  string title = 4;
  bool route_to_intake = 5;
  string reason = 6;
}
message BacklogQueueResponse {
  repeated BacklogQueueItem items = 1;
  string resolved_hearth = 2;
  repeated BacklogUnrankedQueueItem unranked_items = 3;
}

// ---------------------------------------------------------------------------
// RunDetail RPC — pure read, no mutation, LOCAL-ONLY.
//
// One run's own record: the steps it has taken, the actors who took them, and
// the runs that were started from inside it. The Playbooks depth panel needs
// exactly this and must not derive it: two surfaces each folding a run's
// history is how two surfaces come to disagree about what happened. The gRPC
// RPC and the `/ws` `run_detail` JSON-RPC method fold the SAME
// `compute_run_detail`.
//
// The steps come from the authoritative per-file transition event store under
// `<artifact_dir>/transitions/`, merged with the legacy `status.yaml`
// `transitions:` array by the one transition-log seam. The actors come from
// that artifact's `actors:` table.
//
// THERE IS NO COST FIGURE IN ANVIL, SO THIS RESPONSE CARRIES NONE. Nothing in
// this engine records what a step cost — no spend, no token count, no price,
// no autonomy rung, on any artifact or any event. A `cost` field here could
// only ever carry a fabricated zero, which reads to a person as a step that
// was free. Its absence is the contract, not an omission.
//
// CORRECTED 2026-08-14, AND THE REFUSAL STANDS. The sentence above claims more
// than is true and the overclaim was load-bearing: a per-run `total_cost_usd`
// and `total_tokens` DO reach this engine, parsed from temper's per-instance
// scorecards in `anvil-engine/src/scorecard_reader.rs`, and both are
// `#[serde(default)]` — so a scorecard missing the key already yields a
// fabricated `0.0` inside this process. They are dropped before any summary and
// they have never reached a wire response, which is why this response carries
// none and will keep carrying none. What is NOT true is "nothing in this engine
// records what a step cost". A reader who took the broader sentence for a fact
// would conclude a cost figure has to be invented from nothing; it does not, it
// has to be TRUSTED, which is a different and harder question.
//
// The autonomy ladder needs a cost per run. Whether to show one is the owner's
// decision, and what it turns on is stated in the track spec
// `20260814T1815_autonomy_evidence_measurement_substrate`: a figure this engine
// receives from a caller is that caller's claim, not this engine's measurement,
// and the `serde(default)` zero is the fabricated zero this comment names,
// already in the tree.
//
// FAIL-CLOSED on path escape: the hearth resolves through the SAME
// `HearthPolicy` every other query enforces, and the located artifact
// directory is re-checked against it (a symlinked artifact directory pointing
// out of the hearth is refused, PermissionDenied). The caller supplies an
// instance id, NEVER a path. FAIL-OPEN on ordinary read trouble: an
// unreadable hearth yields `found=false` with an honest `error_message`, and
// an unreadable/unparseable CHILD artifact is skipped rather than sinking the
// whole read.
message RunDetailRequest {
  string hearth_path = 1;   // per-call hearth resolution (mirror LiveInstances)
  // The run's artifact directory id — the SAME value `LiveInstance.instance_id`
  // carries. Resolved by scanning the hearth's per-kind directories; never
  // interpreted as a path.
  string instance_id = 2;
}

message RunDetailResponse {
  // The canonical hearth path the engine actually read.
  string resolved_hearth = 1;
  // False when no artifact directory in the hearth carries that id. That is an
  // ANSWER, not a failure: `nodes` is empty and `error_message` stays empty.
  bool found = 2;
  // nodes[0] is the run that was asked for (depth 0). Every node after it is a
  // run started from inside it (depth 1), ordered by its first step's `at`
  // ascending, ties broken by instance_id.
  repeated RunNode nodes = 3;
  // Non-empty ONLY on a soft read failure (the hearth could not be listed) —
  // `nodes` is empty in that case, never a fabricated list. Empty on success
  // AND on a clean not-found.
  string error_message = 4;
}

// One run in the record.
message RunNode {
  string instance_id = 1;
  string kind = 2;   // the artifact's `kind` from status.yaml
  string state = 3;  // the FOLDED current state (status.yaml + transition events)
  string artifact_dir = 4;
  // The run this one was started from inside. EMPTY for the run that was asked
  // for — it is the root of this record and is nested under nothing.
  string parent_instance_id = 5;
  // 0 for the run that was asked for, 1 for a run started from inside it.
  uint32 depth = 6;
  repeated RunStep steps = 7;
  repeated RunActor actors = 8;
}

// One step a run took. EMPTY means the record does not carry the field — a
// step nobody had to approve names nobody. NEVER a placeholder value: "n/a" or
// "system" in the approver slot is a claim about who signed off.
message RunStep {
  string to_state = 1;
  string at = 2;
  string actor = 3;
  string role = 4;
  string approver = 5;
  string note = 6;
  // The reviewer verdict recorded on this step, EMPTY when nobody reviewed it.
  // "What it got wrong, and who caught it" needs the verdict and the actor on
  // the same row; the event store has carried both since the carry-forward
  // slice and the fold dropped the verdict, so every catch was invisible to
  // every reader of this record. Empty is the ordinary case and is a surface's
  // cue to render nothing — it is never "none" or "satisfied".
  string verdict = 7;
}

// One actor from the run's `actors:` table. `model`/`provider` come from that
// actor's MOST RECENT `configurations` entry, and are EMPTY when the table
// carries none (a human, or an unconfigured agent) — never fabricated.
message RunActor {
  string name = 1;
  string actor_type = 2;
  string model = 3;
  string provider = 4;
}

// JoinCoverage RPC — pure read, no mutation, and no write of any kind
// (including no persisted salt: this path resolves the key epoch with the
// NON-generating peek, never `resolve_salt`).
//
// Folds the delivery-log and activity-log sinks of the requested hearths into
// the conversation-scoped join: which delivered guidance kind was followed by a
// begin of that kind in the same conversation and the same hearth. The matching
// arithmetic lives in one place (`anvil_core::domain::join_episode`); this RPC
// is its wire seam.
message JoinCoverageRequest {
  // Scalar spelling. Combined with `hearth_paths` as a UNION, never mutually
  // exclusive. Empty resolves the engine default exactly as every other read
  // RPC does.
  string hearth_path = 1;
  // List spelling. An EMPTY entry names no hearth and is SKIPPED — the empty
  // string is the default sentinel of the scalar field only, and defaulting it
  // here would fold a hearth nobody asked for into a per-hearth report.
  repeated string hearth_paths = 2;
  // RFC3339 bounds, start inclusive / end exclusive; empty means unbounded.
  string window_start = 3;
  string window_end = 4;
  // Filters on the EPISODE's project_label. Empty means no filter. Filtering
  // narrows what is counted and changes nothing about where it is reported.
  string project_label = 5;
}

// Per hearth, never pooled. There is no fleet-total field and none may be
// added: the two hearths were measured at materially different begin-side
// coverage, so a pooled number would be dominated by whichever is better
// instrumented. There is also no path field — a report that names a hearth by
// its filesystem location is a leak, which is what `hearth_label` exists for.
message JoinCoverageResponse {
  repeated HearthJoinCoverageReport per_hearth = 1;
  // The `JOIN_FILTER_VERSION` constant, never a re-typed literal.
  string filter_version = 2;
}

message HearthJoinCoverageReport {
  // Basename of the hearth root, disambiguated to `<basename>#<ordinal>` when
  // two members of one request share it. Never a path.
  string hearth_label = 1;
  string window_start = 2;
  string window_end = 3;
  uint64 delivery_rows_read = 4;
  // Lines that did not parse. Counted, never skipped: a reader that drops what
  // it cannot parse improves its own coverage number by shrinking its
  // denominator.
  uint64 read_defects = 5;
  uint64 activity_rows_scanned = 6;
  uint64 activity_rows_retained = 7;
  uint64 begin_rows_read = 8;
  // Delivery rows in the window carrying a NON-EMPTY guidance_kind.
  uint64 episode_denominator = 9;
  uint64 begin_denominator = 10;
  // Excluded from the episode denominator and reported beside it.
  uint64 menu_delivered = 11;
  uint64 nothing_delivered = 12;
  uint64 no_engine_answer = 13;
  uint64 joined = 14;
  JoinUnjoinCounts unjoin = 15;
  JoinBeginUnjoinCounts begin_unjoin = 16;
  JoinTerminalCounts terminal = 17;
  // The fingerprint of the ONE deployment salt — identical on every entry of a
  // single response — or `unknown_key_epoch`. Never the salt itself.
  string key_epoch = 18;
  // The fingerprint of THIS hearth's own `.telemetry-salt`, empty when it holds
  // none. Also never the salt itself.
  string hearth_salt_file_epoch = 19;
  // One of NoEffectiveSalt | NoLocalEvidence | MatchesEffective |
  // DiffersFromEffective. Four states and never a boolean: "this hearth holds
  // no salt file" is not "no conflict".
  string key_epoch_reconciliation = 20;
}

// Causes, not one bucket: two deliveries against one begin is a different fact
// from a delivery nobody acted on.
message JoinUnjoinCounts {
  uint64 no_conversation_key = 1;
  uint64 pre_migration_row = 2;
  uint64 conversation_absent_from_begin_side = 3;
  uint64 no_begin_of_kind_in_conversation = 4;
  uint64 superseded_by_later_delivery_of_kind = 5;
}

message JoinBeginUnjoinCounts {
  uint64 no_conversation_key = 1;
  uint64 conversation_absent_from_delivery_side = 2;
  uint64 no_prior_delivery_of_kind = 3;
  uint64 no_unconsumed_prior_delivery_of_kind = 4;
}

message JoinTerminalCounts {
  uint64 not_joined = 1;
  uint64 not_yet_terminal = 2;
  uint64 reached_terminal = 3;
  uint64 unknown_run_state = 4;
}
