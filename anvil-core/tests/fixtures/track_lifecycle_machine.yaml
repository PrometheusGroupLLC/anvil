register: driven
success_rubric:
  dimensions:
  - dimension: faithfulness_to_real_process
    weight: 4
    evidence_class: artifact_of_consequence
  - dimension: correctness
    weight: 3
    evidence_class: artifact_of_consequence
  - dimension: research_rigor
    weight: 2
    evidence_class: verifiable_citation
  - dimension: forethought
    weight: 2
    evidence_class: verifiable_citation
  grader: track_lifecycle_rubric_judge_v1
  lagging_signals:
  - reached_completed_state
  - artifact_git_churn
  - revert_or_rework_mention
  - began_then_abandoned_at_spec
  anchors:
  - instance: good-full-lifecycle-driven-end-to-end
    band: good
  - instance: good-audit-first-research-rigor
    band: good
  - instance: good-review-loop-catches-real-defects
    band: good
  - instance: bad-impl-on-stale-branch-base-rework
    band: bad
  - instance: trap-workflow-shaped-work-without-lifecycle
    band: trap
  - instance: trap-begun-then-abandoned-at-spec
    band: trap
  - instance: hidden-virtue-state-field-drift-masks-completion
    band: hidden_virtue
outcome_predicate:
  terminal_state: completed
  check: the track reached completed with a reflection.md recording what shipped and all review gates satisfied
