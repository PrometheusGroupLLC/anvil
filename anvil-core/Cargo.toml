[package]
name = "anvil-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
# No technical blocker — it packages cleanly; remove this line to actually publish.
publish = false

[features]
# Enables test-only APIs (seed overrides, etc.) used by anvil-test-support.
# Never enabled in production builds. Activated via dev-dependency feature flag.
test-support = []

[dependencies]
chrono = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
# `anvil-core-steps` and `anvil-test-support` are deliberately absent: both
# depend on the private `brine` sibling, and cargo loads a dev-dependency's
# manifest like any other, so naming them here dragged brine into the default
# workspace. The Brine runner for this crate's features now lives at
# `brine-tests/anvil-core-steps/tests/brine_runner.rs`; the features themselves
# stay here in `anvil-core/features/`.
#
# `tempfile` remains — the non-Brine test targets in `tests/` (hearth_lint,
# playbook_integrity, ...) use it and are unaffected by the split.
tempfile = "3"

[lints]
workspace = true
