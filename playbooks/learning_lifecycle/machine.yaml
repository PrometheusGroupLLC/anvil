kind: learning
register: free
route:
  triggers: []
directory: learnings
registry: learnings.md
parent_kind: ~
description: "Knowledge that matures from raw observation through interpreted conclusion to validated established knowledge."
required_fields:
  - name: name
    field_type: string
    description: Learning title
roles:
  - doer
  - learn
  - reviewer
  - amend
states:
  - name: observation
    role_filters: [doer_actionable]
    registry_section: observation
    projection_targets: []
    is_review_gate: false
    is_terminal: false
    hooks_by_role:
      doer: capture.md
  - name: observation_review
    role_filters: [review_pending]
    registry_section: observation
    projection_targets: []
    is_review_gate: true
    is_terminal: false
    hooks_by_role:
      reviewer: observation.md
  - name: observation_revision
    role_filters: [doer_actionable]
    registry_section: observation
    projection_targets: []
    is_review_gate: false
    is_terminal: false
    hooks_by_role:
      doer: revise.md
  - name: conclusion
    role_filters: [doer_actionable]
    registry_section: conclusion
    projection_targets: []
    is_review_gate: false
    is_terminal: false
    hooks_by_role:
      doer: interpret.md
  - name: conclusion_review
    role_filters: [review_pending]
    registry_section: conclusion
    projection_targets: []
    is_review_gate: true
    is_terminal: false
    hooks_by_role:
      reviewer: conclusion.md
  - name: conclusion_revision
    role_filters: [doer_actionable]
    registry_section: conclusion
    projection_targets: []
    is_review_gate: false
    is_terminal: false
    hooks_by_role:
      doer: revise.md
  - name: established
    role_filters: [doer_actionable]
    registry_section: established
    projection_targets: []
    is_review_gate: false
    is_terminal: false
    hooks_by_role:
      doer: establish.md
  - name: amend
    role_filters: [doer_actionable]
    registry_section: established
    projection_targets: []
    is_review_gate: false
    is_terminal: false
    hooks_by_role:
      doer: amend.md
  - name: amend_review
    role_filters: [review_pending]
    registry_section: established
    projection_targets: []
    is_review_gate: true
    is_terminal: false
    hooks_by_role:
      reviewer: amend-review.md
  - name: amend_revision
    role_filters: [doer_actionable]
    registry_section: established
    projection_targets: []
    is_review_gate: false
    is_terminal: false
    hooks_by_role:
      doer: revise.md
  - name: graduated
    role_filters: [terminal]
    registry_section: graduated
    projection_targets: []
    is_review_gate: false
    is_terminal: true
    hooks_by_role:
      doer: graduate.md
  - name: retired
    role_filters: [terminal]
    registry_section: retired
    projection_targets: []
    is_review_gate: false
    is_terminal: true
    hooks_by_role:
      doer: retire.md
transitions:
  - from_state: observation
    to_state: observation_review
    required_role: learn
    required_satisfaction: ~
    requires_approver: false
  - from_state: observation
    to_state: conclusion
    required_role: learn
    required_satisfaction: ~
    requires_approver: false
  - from_state: observation_review
    to_state: observation_revision
    required_role: learn
    required_satisfaction: [needs_revision]
    requires_approver: false
  - from_state: observation_review
    to_state: observation
    required_role: reviewer
    required_satisfaction: [satisfied]
    requires_approver: true
  - from_state: observation_revision
    to_state: observation_review
    required_role: learn
    required_satisfaction: ~
    requires_approver: false
  - from_state: conclusion
    to_state: conclusion_review
    required_role: learn
    required_satisfaction: ~
    requires_approver: false
  - from_state: conclusion_review
    to_state: conclusion_revision
    required_role: learn
    required_satisfaction: [needs_revision]
    requires_approver: false
  - from_state: conclusion_review
    to_state: established
    required_role: reviewer
    required_satisfaction: [satisfied]
    requires_approver: true
  - from_state: conclusion_revision
    to_state: conclusion_review
    required_role: learn
    required_satisfaction: ~
    requires_approver: false
  - from_state: established
    to_state: amend
    required_role: amend
    required_satisfaction: ~
    requires_approver: false
  - from_state: established
    to_state: graduated
    required_role: learn
    required_satisfaction: ~
    requires_approver: false
  - from_state: established
    to_state: retired
    required_role: learn
    required_satisfaction: ~
    requires_approver: false
  - from_state: amend
    to_state: amend_review
    required_role: amend
    required_satisfaction: ~
    requires_approver: false
  - from_state: amend_review
    to_state: amend_revision
    required_role: amend
    required_satisfaction: [needs_revision]
    requires_approver: false
  - from_state: amend_review
    to_state: established
    required_role: reviewer
    required_satisfaction: [satisfied]
    requires_approver: true
  - from_state: amend_revision
    to_state: amend_review
    required_role: amend
    required_satisfaction: ~
    requires_approver: false
outcome_predicate:
  terminal_state: established
  check: the learning reached established with a conclusion_review satisfied, promoting a raw observation into validated institutional knowledge
