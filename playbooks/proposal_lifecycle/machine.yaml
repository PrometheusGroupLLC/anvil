kind: proposal
register: free
route:
  triggers: []
directory: proposals
registry: proposals.md
parent_kind: ~
description: "Strategic direction and approach that can spawn implementation tracks."
required_fields:
  - name: name
    field_type: string
    description: Proposal title
roles:
  - doer
  - envision
  - propose
  - reviewer
  - amend
  - reflect
states:
  - name: vision
    role_filters: [doer_actionable]
    registry_section: vision
    projection_targets: [proposals.md]
    is_review_gate: false
    is_terminal: false
    hooks_by_role:
      doer: envision.md
      envision: envision.md
    measurement_by_role:
      doer:
        intent: "Frame the problem, desired future state, urgency, and relationship to existing work without committing to an approach."
        expected_output: "A vision.md direction artifact ready for vision review."
        success_criteria: "A `vision.md` frames the problem, the desired future state, and the urgency, names its relationship to existing proposals or tracks, and commits to NO implementation approach (zero solution or architecture choices stated)."
      envision:
        intent: "Frame the problem, desired future state, urgency, and relationship to existing work without committing to an approach."
        expected_output: "A vision.md direction artifact ready for vision review."
        success_criteria: "A `vision.md` frames the problem, the desired future state, and the urgency, names its relationship to existing proposals or tracks, and commits to NO implementation approach (zero solution or architecture choices stated)."
  - name: vision_review
    role_filters: [review_pending]
    registry_section: vision
    projection_targets: [proposals.md]
    is_review_gate: true
    is_terminal: false
    hooks_by_role:
      reviewer: vision-review.md
    measurement_by_role:
      reviewer:
        intent: "Review whether the direction is worth pursuing, the problem is real, and the desired future state is compelling."
        expected_output: "A vision.review.md entry with satisfied sign-off or specific findings."
        success_criteria: "A `vision.review.md` verdict addresses problem reality, future-state clarity, and urgency. A satisfied verdict cites the `vision.md` evidence establishing each (a real named problem, a clear desired future state, a stated urgency) and confirms no implementation approach was committed; a needs_revision verdict names at least 1 specific gap among those three. No direction is approved without a stated problem or with any dimension left unassessed."
  - name: vision_revision
    role_filters: [doer_actionable]
    registry_section: vision
    projection_targets: [proposals.md]
    is_review_gate: false
    is_terminal: false
    hooks_by_role:
      doer: vision-revise.md
      envision: vision-revise.md
    measurement_by_role:
      doer:
        intent: "Revise the vision in response to vision-review findings."
        expected_output: "An updated vision.md plus vision.review.md dispositions for every finding."
        success_criteria: "An updated `vision.md` plus a `vision.review.md` response dispositioning every finding (addressed or rejected-with-rationale), leaving zero findings undispositioned and the no-approach boundary intact."
      envision:
        intent: "Revise the vision in response to vision-review findings."
        expected_output: "An updated vision.md plus vision.review.md dispositions for every finding."
        success_criteria: "An updated `vision.md` plus a `vision.review.md` response dispositioning every finding (addressed or rejected-with-rationale), leaving zero findings undispositioned and the no-approach boundary intact."
  - name: draft
    role_filters: [doer_actionable]
    registry_section: draft
    projection_targets: [proposals.md]
    is_review_gate: false
    is_terminal: false
    hooks_by_role:
      doer: propose.md
      propose: propose.md
    measurement_by_role:
      doer:
        intent: "Research the approved vision and draft the concrete proposal approach."
        expected_output: "A proposal.md approach artifact ready for draft review."
        success_criteria: "A `proposal.md` states the concrete approach grounded in the approved vision, cites the research that informed it, and names the tracks the approach would spawn; the approach is falsifiable, not a restatement of the vision."
      propose:
        intent: "Research the approved vision and draft the concrete proposal approach."
        expected_output: "A proposal.md approach artifact ready for draft review."
        success_criteria: "A `proposal.md` states the concrete approach grounded in the approved vision, cites the research that informed it, and names the tracks the approach would spawn; the approach is falsifiable, not a restatement of the vision."
  - name: draft_review
    role_filters: [review_pending]
    registry_section: draft
    projection_targets: [proposals.md]
    is_review_gate: true
    is_terminal: false
    hooks_by_role:
      reviewer: draft-review.md
    measurement_by_role:
      reviewer:
        intent: "Review the draft proposal approach for feasibility, scope, and fit with the approved vision."
        expected_output: "A proposal.review.md entry with satisfied sign-off or specific findings."
        success_criteria: "A `proposal.review.md` verdict addresses feasibility, scope, and vision-fit of the drafted approach. A satisfied verdict cites the `proposal.md` evidence clearing each (a feasible approach, a bounded scope, and fidelity to the approved vision); a needs_revision verdict names at least 1 specific gap among those three tied to the drafted approach. No verdict is satisfied without that cited evidence or with any dimension left unassessed."
  - name: draft_revision
    role_filters: [doer_actionable]
    registry_section: draft
    projection_targets: [proposals.md]
    is_review_gate: false
    is_terminal: false
    hooks_by_role:
      doer: proposal-revise.md
      propose: proposal-revise.md
    measurement_by_role:
      doer:
        intent: "Revise the draft proposal in response to draft-review findings."
        expected_output: "An updated proposal.md plus proposal.review.md dispositions for every finding."
        success_criteria: "An updated `proposal.md` plus a `proposal.review.md` response dispositioning every draft-review finding, leaving zero findings undispositioned and approved vision scope preserved."
      propose:
        intent: "Revise the draft proposal in response to draft-review findings."
        expected_output: "An updated proposal.md plus proposal.review.md dispositions for every finding."
        success_criteria: "An updated `proposal.md` plus a `proposal.review.md` response dispositioning every draft-review finding, leaving zero findings undispositioned and approved vision scope preserved."
  - name: proposal
    role_filters: [doer_actionable]
    registry_section: draft
    projection_targets: [proposals.md]
    is_review_gate: false
    is_terminal: false
    hooks_by_role:
      doer: propose.md
      propose: propose.md
    measurement_by_role:
      doer:
        intent: "Finalize the proposal approach for full proposal review."
        expected_output: "A proposal.md artifact ready for proposal review."
        success_criteria: "A `proposal.md` finalizes the approach with every open draft-review concern resolved and the tracks-to-spawn and success signals named, ready for activation review with zero unresolved TODOs."
      propose:
        intent: "Finalize the proposal approach for full proposal review."
        expected_output: "A proposal.md artifact ready for proposal review."
        success_criteria: "A `proposal.md` finalizes the approach with every open draft-review concern resolved and the tracks-to-spawn and success signals named, ready for activation review with zero unresolved TODOs."
  - name: proposal_review
    role_filters: [review_pending]
    registry_section: draft
    projection_targets: [proposals.md]
    is_review_gate: true
    is_terminal: false
    hooks_by_role:
      reviewer: proposal-review.md
    measurement_by_role:
      reviewer:
        intent: "Review whether the proposal approach is sound enough to activate."
        expected_output: "A proposal.review.md entry with satisfied sign-off or specific findings."
        success_criteria: "A `proposal.review.md` verdict assesses approach soundness and activation readiness. A satisfied verdict cites the `proposal.md` evidence that the approach is sound and activation-ready (open draft-review concerns resolved, tracks-to-spawn and success signals named); a needs_revision verdict names at least 1 concrete soundness or activation-readiness gap. No proposal is activated with an unresolved approach or with any dimension left unassessed."
  - name: proposal_revision
    role_filters: [doer_actionable]
    registry_section: draft
    projection_targets: [proposals.md]
    is_review_gate: false
    is_terminal: false
    hooks_by_role:
      doer: proposal-revise.md
      propose: proposal-revise.md
    measurement_by_role:
      doer:
        intent: "Revise the proposal in response to proposal-review findings."
        expected_output: "An updated proposal.md plus proposal.review.md dispositions for every finding."
        success_criteria: "An updated `proposal.md` plus a `proposal.review.md` response dispositioning every proposal-review finding, leaving zero findings undispositioned."
      propose:
        intent: "Revise the proposal in response to proposal-review findings."
        expected_output: "An updated proposal.md plus proposal.review.md dispositions for every finding."
        success_criteria: "An updated `proposal.md` plus a `proposal.review.md` response dispositioning every proposal-review finding, leaving zero findings undispositioned."
  - name: active
    role_filters: [doer_actionable]
    registry_section: active
    projection_targets: [proposals.md]
    is_review_gate: false
    is_terminal: false
    hooks_by_role:
      doer: terminal.md
      amend: amend.md
      reflect: reflect.md
    measurement_by_role:
      doer:
        intent: "Close, supersede, or abandon an active proposal with human approval."
        expected_output: "A terminal transition preserving the closure rationale."
        success_criteria: "A terminal transition to completed, superseded, or abandoned records the closure rationale and carries the required human approver sign-off, with zero terminal moves made without an approver."
      amend:
        intent: "Append a proposal amendment when active execution changes proposal-level intent."
        expected_output: "An append-only proposal.amendments.md entry ready for amendment review."
        success_criteria: "A numbered append-only entry in `proposal.amendments.md` names how proposal-level intent changed, why, and its impact on the tracks the proposal governs, with the frozen `proposal.md` unedited (zero diff outside `proposal.amendments.md`)."
      reflect:
        intent: "Reflect on the active proposal's realized semantic delta."
        expected_output: "A reflection.md artifact ready for reflection review."
        success_criteria: "A `reflection.md` names the semantic delta between the proposal's intended direction and what its linked tracks realized, and owns at least 1 assumption that proved wrong (or states none did, backed by evidence)."
  - name: amend
    role_filters: [doer_actionable]
    registry_section: active
    projection_targets: [proposals.md]
    is_review_gate: false
    is_terminal: false
    hooks_by_role:
      amend: amend.md
    measurement_by_role:
      amend:
        intent: "Append a proposal amendment when active execution changes proposal-level intent."
        expected_output: "An append-only proposal.amendments.md entry ready for amendment review."
        success_criteria: "A numbered append-only entry in `proposal.amendments.md` names how proposal-level intent changed, why, and its impact on the tracks the proposal governs, with the frozen `proposal.md` unedited (zero diff outside `proposal.amendments.md`)."
  - name: amend_review
    role_filters: [review_pending]
    registry_section: active
    projection_targets: [proposals.md]
    is_review_gate: true
    is_terminal: false
    hooks_by_role:
      reviewer: amend-review.md
    measurement_by_role:
      reviewer:
        intent: "Review whether the proposal amendment changes proposal-level intent and is safe to approve."
        expected_output: "A proposal.review.md amendment-review entry with satisfied sign-off or findings."
        success_criteria: "A `proposal.review.md` amendment-review entry addresses necessity, scope, and append-only discipline. A satisfied verdict cites the `proposal.amendments.md` evidence showing the change is necessary, scoped to proposal-level intent, and appended without editing the frozen `proposal.md`; a needs_revision verdict names at least 1 specific gap among those three. No verdict is satisfied while the frozen `proposal.md` shows a diff or any dimension is left unassessed."
  - name: amend_revision
    role_filters: [doer_actionable]
    registry_section: active
    projection_targets: [proposals.md]
    is_review_gate: false
    is_terminal: false
    hooks_by_role:
      amend: amend-revise.md
    measurement_by_role:
      amend:
        intent: "Revise the proposal amendment in response to amendment-review findings."
        expected_output: "Updated proposal.amendments.md plus review dispositions."
        success_criteria: "An updated `proposal.amendments.md` plus a review response dispositioning every finding (addressed or rejected-with-rationale), with zero findings open and the frozen `proposal.md` unedited (zero diff outside `proposal.amendments.md`)."
  - name: reflecting
    role_filters: [doer_actionable]
    registry_section: reflecting
    projection_targets: [proposals.md]
    is_review_gate: false
    is_terminal: false
    hooks_by_role:
      reflect: reflect.md
    measurement_by_role:
      reflect:
        intent: "Write the proposal reflection covering semantic delta and lessons from linked tracks."
        expected_output: "A reflection.md artifact ready for reflection review."
        success_criteria: "A `reflection.md` states the realized-vs-intended semantic delta, extracts at least 1 durable lesson from the linked tracks, and is not a restatement of the proposal in past tense."
  - name: reflection_review
    role_filters: [review_pending]
    registry_section: reflecting
    projection_targets: [proposals.md]
    is_review_gate: true
    is_terminal: false
    hooks_by_role:
      reviewer: reflection-review.md
    measurement_by_role:
      reviewer:
        intent: "Review whether the proposal reflection accurately captures realized intent and remaining deltas."
        expected_output: "A reflection.review.md entry with satisfied sign-off or findings."
        success_criteria: "A `reflection.review.md` verdict assesses the realized-vs-intended semantic delta and the extracted lessons. A satisfied verdict cites the `reflection.md` evidence backing the stated delta and at least 1 durable lesson; a needs_revision verdict names at least 1 realized-intent or remaining-delta claim the reflection got wrong or omitted. No verdict is satisfied while a delta claim lacks evidence or any dimension is left unassessed."
  - name: reflection_revision
    role_filters: [doer_actionable]
    registry_section: reflecting
    projection_targets: [proposals.md]
    is_review_gate: false
    is_terminal: false
    hooks_by_role:
      reflect: reflection-revise.md
    measurement_by_role:
      reflect:
        intent: "Revise the proposal reflection in response to reflection-review findings."
        expected_output: "An updated reflection.md plus reflection.review.md dispositions."
        success_criteria: "An updated `reflection.md` plus a `reflection.review.md` response dispositioning every finding, with zero delta claims left inaccurate."
  - name: completed
    role_filters: [terminal]
    registry_section: completed
    projection_targets: [proposals.md]
    is_review_gate: false
    is_terminal: true
    hooks_by_role:
      doer: terminal.md
  - name: superseded
    role_filters: [terminal]
    registry_section: superseded
    projection_targets: [proposals.md]
    is_review_gate: false
    is_terminal: true
    hooks_by_role:
      doer: terminal.md
  - name: abandoned
    role_filters: [terminal]
    registry_section: abandoned
    projection_targets: [proposals.md]
    is_review_gate: false
    is_terminal: true
    hooks_by_role:
      doer: terminal.md
transitions:
  - from_state: vision
    to_state: vision_review
    required_role: envision
    required_satisfaction: ~
    requires_approver: false
  - from_state: vision_review
    to_state: vision_revision
    required_role: envision
    required_satisfaction: [needs_revision]
    requires_approver: false
  - from_state: vision_review
    to_state: draft
    required_role: reviewer
    required_satisfaction: [satisfied]
    requires_approver: true
  - from_state: vision_revision
    to_state: vision_review
    required_role: envision
    required_satisfaction: ~
    requires_approver: false
  - from_state: draft
    to_state: draft_review
    required_role: propose
    required_satisfaction: ~
    requires_approver: false
  - from_state: draft_review
    to_state: draft_revision
    required_role: propose
    required_satisfaction: [needs_revision]
    requires_approver: false
  - from_state: draft_review
    to_state: proposal
    required_role: reviewer
    required_satisfaction: [satisfied]
    requires_approver: true
  - from_state: draft_revision
    to_state: draft_review
    required_role: propose
    required_satisfaction: ~
    requires_approver: false
  - from_state: proposal
    to_state: proposal_review
    required_role: propose
    required_satisfaction: ~
    requires_approver: false
  - from_state: proposal_review
    to_state: proposal_revision
    required_role: propose
    required_satisfaction: [needs_revision]
    requires_approver: false
  - from_state: proposal_review
    to_state: active
    required_role: reviewer
    required_satisfaction: [satisfied]
    requires_approver: true
  - from_state: proposal_revision
    to_state: proposal_review
    required_role: propose
    required_satisfaction: ~
    requires_approver: false
  - from_state: active
    to_state: amend
    required_role: amend
    required_satisfaction: ~
    requires_approver: false
  - from_state: amend
    to_state: amend_review
    required_role: amend
    required_satisfaction: ~
    requires_approver: false
  - from_state: amend_review
    to_state: amend_revision
    required_role: amend
    required_satisfaction: [needs_revision]
    requires_approver: false
  - from_state: amend_review
    to_state: active
    required_role: reviewer
    required_satisfaction: [satisfied]
    requires_approver: true
  - from_state: amend_revision
    to_state: amend_review
    required_role: amend
    required_satisfaction: ~
    requires_approver: false
  - from_state: active
    to_state: reflecting
    required_role: reflect
    required_satisfaction: ~
    requires_approver: false
  - from_state: reflecting
    to_state: reflection_review
    required_role: reflect
    required_satisfaction: ~
    requires_approver: false
  - from_state: reflection_review
    to_state: reflection_revision
    required_role: reflect
    required_satisfaction: [needs_revision]
    requires_approver: false
  - from_state: reflection_review
    to_state: active
    required_role: reviewer
    required_satisfaction: [satisfied]
    requires_approver: true
  - from_state: reflection_revision
    to_state: reflection_review
    required_role: reflect
    required_satisfaction: ~
    requires_approver: false
  - from_state: active
    to_state: completed
    required_role: doer
    required_satisfaction: ~
    requires_approver: true
  - from_state: active
    to_state: superseded
    required_role: doer
    required_satisfaction: ~
    requires_approver: true
  - from_state: active
    to_state: abandoned
    required_role: doer
    required_satisfaction: ~
    requires_approver: true
outcome_predicate:
  terminal_state: active
  check: the proposal reached active with an approver-signed proposal_review satisfied, so it is a governing direction that can spawn implementation tracks rather than an unreviewed draft
