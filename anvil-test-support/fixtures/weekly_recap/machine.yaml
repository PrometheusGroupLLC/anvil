kind: weekly_recap
directory: weekly_recaps
registry: weekly_recaps.md
parent_kind: ~
description: "Consulting weekly recap workflow: assemble weekly engagement evidence into a concise internal recap."
owner_kit: consulting-kit
visibility: internal
route:
  triggers: ["weekly recap", "recap"]
access:
  org: Consulting
  min_role: read
  sensitivity: internal
  space: ~
required_fields: []
roles:
  - doer
  - reviewer
states:
  - name: drafting
    role_filters: []
    registry_section: active
    projection_targets: []
    is_review_gate: false
    is_terminal: false
    hook: ~
    hooks_by_role: {}
    measurement_by_role: {}
  - name: completed
    role_filters: []
    registry_section: completed
    projection_targets: []
    is_review_gate: false
    is_terminal: true
    hook: ~
    hooks_by_role: {}
    measurement_by_role: {}
transitions:
  - from_state: drafting
    to_state: completed
    required_role: doer
    required_satisfaction: ~
    requires_approver: false
register: driven
