kind: k5_bindable_min
directory: k5_bindable_mins
registry: k5_bindable_mins.md
parent_kind: ~
description: "K5 minimal supervision shape: the canonical bindable driven machine — a single unattended doer Complete resolves drafting -> completed, with a Snapshot-driven -> abandoned park edge for the cancel leg."
owner_kit: k5-bind-test
visibility: internal
route:
  triggers: ["k5 bindable min"]
access:
  org: Foundation
  min_role: read
  sensitivity: internal
  space: ~
required_fields: []
roles:
  - doer
  - reviewer
states:
  - name: drafting
    role_filters: []
    registry_section: active
    projection_targets: []
    is_review_gate: false
    is_terminal: false
    hook: ~
    hooks_by_role: {}
    measurement_by_role: {}
  - name: completed
    role_filters: []
    registry_section: completed
    projection_targets: []
    is_review_gate: false
    is_terminal: true
    hook: ~
    hooks_by_role: {}
    measurement_by_role: {}
  - name: abandoned
    role_filters: []
    registry_section: abandoned
    projection_targets: []
    is_review_gate: false
    is_terminal: true
    hook: ~
    hooks_by_role: {}
    measurement_by_role: {}
transitions:
  # The single null-satisfaction non-reviewer forward candidate from the initial
  # state — a plain-doer Complete rides this to terminal `completed` (check (a)).
  - from_state: drafting
    to_state: completed
    required_role: doer
    required_satisfaction: ~
    requires_approver: false
  # The `-> abandoned` park edge (check (b)). Pinned to required_satisfaction:
  # [abandoned] (the track_lifecycle convention) so it is EXCLUDED from the
  # plain-doer candidate set and never collides with the forward Complete
  # (F1). The abandon resolve itself is a free-form Snapshot(to_state:"abandoned").
  - from_state: drafting
    to_state: abandoned
    required_role: doer
    required_satisfaction:
      - abandoned
    requires_approver: false
register: driven
