kind: lore_query
directory: ""
registry: ""
description: "Answer natural-language questions from Lore topics and linked evidence."
route:
  triggers: ["ask lore", "query my knowledge", "answer from my topics"]
required_fields: []
roles:
  - doer
states:
  - name: answering
    role_filters: []
    registry_section: active
    projection_targets: []
    is_review_gate: false
    is_terminal: false
    hook: answering.md
    hooks_by_role: {}
    measurement_by_role:
      doer:
        intent: "Answer the user's Lore question from linked topic evidence."
        expected_output: "A sourced answer that names the evidence used."
  - name: completed
    role_filters: []
    registry_section: completed
    projection_targets: []
    is_review_gate: false
    is_terminal: true
    hook: ~
    hooks_by_role: {}
    measurement_by_role: {}
transitions:
  - from_state: answering
    to_state: completed
    required_role: doer
    required_satisfaction: ~
    requires_approver: false
