[workspace]
# THE DEFAULT WORKSPACE CONTAINS ONLY THE PRODUCT CRATES.
#
# Cargo loads the manifest of every path dependency reachable from a workspace
# member — including dev-dependencies, and including OPTIONAL dependencies that
# are switched off. "It's only a dev-dep" and "it's optional" buy nothing. So
# while the Brine step crates were members, `cargo metadata --no-deps` on a
# machine without the private `brine` sibling exited 101: anvil's workspace
# could not even be ENUMERATED, let alone built.
#
# The Brine runners therefore live in the separate `brine-tests/` workspace.
# That is workspace MEMBERSHIP, not duplication, so it carries no drift risk —
# and it keeps `cargo build` from ever loading brine. Tests still run normally
# in this repo (see CLAUDE.md for the commands); they are simply not part of a
# public export until brine itself is public, at which point the export can
# include `brine-tests/` and the split resolves itself.
members = [
    "anvil-core",
    "anvil-core-hearth",
    "anvil-engine",
    "anvil-mcp",
]
exclude = [
    "brine-tests",
    # Same reason, different private sibling: `kit-build/anvil-kit-engine` is
    # the ONLY crate that depends on `foundry-kit-broker-client`, and it is
    # excluded so a bare clone never loads that manifest. See kit-build/Cargo.toml.
    "kit-build",
]
resolver = "2"

# An `"a" | "a"` duplicate in a match arm or a repeated key in a literal list is
# exactly how the blanket rename deleted the pre-migration name field and the
# retired artifact type: rustc SAW it, said "unreachable pattern", and the
# warning shipped un-acted-on. A warning nobody must act on is not a gate.
[workspace.lints.rust]
unreachable_patterns = "deny"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "io-util", "process", "net", "sync", "signal"] }
tonic = "0.12"
tonic-build = "0.12"
prost = "0.13"
prost-types = "0.13"
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
http = "1"
futures-util = "0.3"
tokio-tungstenite = "0.24"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
libc = "0.2"
sha2 = "0.10"
