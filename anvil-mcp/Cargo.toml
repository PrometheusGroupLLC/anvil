[package]
name = "anvil-mcp"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
anvil-core-hearth = { path = "../anvil-core-hearth" }
anvil-core = { path = "../anvil-core" }
anvil-engine = { path = "../anvil-engine" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }

# No `[dev-dependencies]`: they named `anvil-mcp-steps`, `anvil-test-support`
# and `brine-runner-rust` — a direct path dependency on the private `brine`
# sibling. Cargo loads those manifests whether or not anything is being tested,
# which is what made `cargo metadata` exit 101 on a machine without brine. The
# Brine runner for this crate's features now lives at
# `brine-tests/anvil-mcp-steps/tests/brine_runner.rs`; the features themselves
# stay here in `anvil-mcp/features/`.

[lints]
workspace = true
